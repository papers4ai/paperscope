name: Sync Manual Subdomains

on:
  push:
    paths:
      - "backend/config/keywords_manual.json"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只预览不写文件 (true/false)"
        default: "false"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install openai (for translation)
        run: pip install openai

      - name: Sync subdomains → task_meta.json
        env:
          LLM_API_KEY:  ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL:    ${{ secrets.LLM_MODEL }}
        run: |
          FLAGS=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && FLAGS="--dry-run"
          python scripts/sync_manual_subdomains.py $FLAGS

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/config/keywords_manual.json frontend/data/task_meta.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: sync manual subdomains → task_meta.json"
            git pull --rebase --autostash
            git push
          fi
