name: Sync curated papers from upstream (weekly)

# 已禁用：上游 Jefferyzhifeng/Paperscope-hub 的 output/papers_curated.json 返回 404。
# 该功能已由 daily_curated_update.yml 完全覆盖（每日从本地重建并推送）。
# 若将来需要恢复从外部上游同步，取消 on: 下方的注释并修正 REMOTE URL。
on:
  workflow_dispatch:   # 仅保留手动触发入口，供调试用

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run curated sync (local rebuild only)
        run: |
          echo "⚠️  Remote upstream sync is disabled (upstream URL returns 404)."
          echo "    Curated data is maintained by daily_curated_update.yml."
          echo "    To sync manually from a local file: python scripts/sync_curated.py --local <path>"
