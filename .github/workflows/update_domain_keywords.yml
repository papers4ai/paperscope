name: Update Domain Keywords (Monthly)

on:
  schedule:
    - cron: "0 5 1 * *"   # 每月1日 UTC 05:00
  workflow_dispatch:
    inputs:
      months:
        description: "分析最近几个月的论文（默认1）"
        default: "1"
      dry_run:
        description: "dry-run：只打印不写文件（true/false）"
        default: "false"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install openai

      - name: Run keyword update
        env:
          LLM_API_KEY:    ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL:   ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL:      ${{ secrets.LLM_MODEL }}
        run: |
          MONTHS="${{ github.event.inputs.months || '1' }}"
          DRY="${{ github.event.inputs.dry_run || 'false' }}"
          FLAGS="--months $MONTHS"
          [ "$DRY" = "true" ] && FLAGS="$FLAGS --dry-run"
          python scripts/update_domain_keywords.py $FLAGS

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/config/keywords_auto.json
          if git diff --cached --quiet; then
            echo "No keyword changes."
          else
            git commit -m "chore: auto-update domain keywords $(date -u +%Y-%m)"
            git pull --rebase --autostash
            git push
          fi
