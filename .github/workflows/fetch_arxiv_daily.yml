name: Fetch arXiv Daily

on:
  schedule:
    - cron: "0 2 * * *"    # UTC 02:00 = 北京 10:00
  workflow_dispatch:
    inputs:
      days:
        description: "回溯天数（留空 = 自动；补录历史可填 30）"
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Determine fetch window
        id: window
        run: |
          if [ -n "${{ github.event.inputs.days }}" ]; then
            # 手动触发时优先使用输入值
            DAYS="${{ github.event.inputs.days }}"
            echo "▶ Manual trigger: --days $DAYS"
          else
            # 每逢日期能被 3 整除，做一次 7 天深度回溯
            DAY=$(date -u +%-d)
            if [ $((DAY % 3)) -eq 0 ]; then
              DAYS=7
              echo "▶ Deep-fetch day (day $DAY of month): --days 7"
            else
              DAYS=3
              echo "▶ Normal day (day $DAY of month): --days 3"
            fi
          fi
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"

      - name: Fetch arXiv → Supabase
        continue-on-error: true   # arXiv 偶发超时/429，不阻断后续导出和部署
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          DAYS="${{ steps.window.outputs.days }}"
          echo "▶ python -m backend.main arxiv-daily --days $DAYS"
          python -m backend.main arxiv-daily --days "$DAYS"

      - name: Export Supabase → papers.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/export_papers.py

      - name: Commit & push if changed
        run: |
          if git diff --quiet frontend/data/; then
            echo "No changes to data files"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/data/papers_*.json frontend/data/meta.json
            git commit -m "chore: daily arxiv sync $(date -u +%Y-%m-%d) [--days ${{ steps.window.outputs.days }}]"
            git pull --rebase
            git push
          fi
