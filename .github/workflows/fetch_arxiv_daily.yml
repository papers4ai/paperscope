name: Fetch arXiv Daily

on:
  schedule:
    - cron: "0 2 * * *"    # UTC 02:00 = 北京 10:00
  workflow_dispatch:
    inputs:
      date_from:
        description: "开始日期 YYYY-MM-DD（填此项则忽略 days）"
        default: ""
      date_to:
        description: "结束日期 YYYY-MM-DD（默认今天）"
        default: ""
      days:
        description: "回溯天数（date_from/date_to 均为空时生效，留空走自动逻辑）"
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # 接近 GitHub Actions 6 小时上限；用于大范围回溯
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Determine fetch window
        id: window
        run: |
          DATE_FROM="${{ github.event.inputs.date_from }}"
          DATE_TO="${{ github.event.inputs.date_to }}"
          DAYS_INPUT="${{ github.event.inputs.days }}"

          # EXPORT_SINCE 用来传给 scripts/export_papers.py，覆盖默认 8 天窗口。
          # 让 export 读取的范围和 fetch 完全对齐，否则手动 backfill 的论文会留在
          # Supabase 但永远进不到 papers_*.json。
          EXPORT_SINCE=""

          if [ -n "$DATE_FROM" ]; then
            # 手动指定日期段
            EXTRA="--date-from $DATE_FROM"
            [ -n "$DATE_TO" ] && EXTRA="$EXTRA --date-to $DATE_TO"
            DESC="${DATE_FROM} → ${DATE_TO:-today}"
            EXPORT_SINCE="$DATE_FROM"
          elif [ -n "$DAYS_INPUT" ]; then
            # 手动指定天数
            EXTRA="--days $DAYS_INPUT"
            DESC="--days $DAYS_INPUT"
            EXPORT_SINCE=$(date -u -d "$DAYS_INPUT days ago" +%Y-%m-%d 2>/dev/null || \
                           python3 -c "from datetime import date,timedelta; print((date.today()-timedelta(days=$DAYS_INPUT)).isoformat())")
          else
            # 自动逻辑：每逢日期能被 3 整除，做一次 7 天深度回溯
            DAY=$(date -u +%-d)
            if [ $((DAY % 3)) -eq 0 ]; then
              EXTRA="--days 7"
              DESC="--days 7 (deep-fetch day $DAY)"
              # deep fetch 要让 export 也回看 7 天 + 缓冲，否则会漏
              EXPORT_SINCE=$(date -u -d "8 days ago" +%Y-%m-%d 2>/dev/null || \
                             python3 -c "from datetime import date,timedelta; print((date.today()-timedelta(days=8)).isoformat())")
            else
              EXTRA="--days 3"
              DESC="--days 3 (normal)"
              # 普通 daily run 走 export 默认 8 天窗口即可，EXPORT_SINCE 留空
            fi
          fi

          echo "extra=$EXTRA"                 >> "$GITHUB_OUTPUT"
          echo "desc=$DESC"                   >> "$GITHUB_OUTPUT"
          echo "export_since=$EXPORT_SINCE"   >> "$GITHUB_OUTPUT"
          echo "▶ Fetch window: $DESC"
          echo "▶ Export since: ${EXPORT_SINCE:-default 8d}"

      - name: Fetch arXiv → Supabase
        # 不再 continue-on-error：之前掩盖了持续 429 → 整周没新论文的故障。
        # 失败时让 workflow 红，下次 schedule/手动重试即可。
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # LLM 语义分类（智谱 GLM-4-Flash 免费），未设置时自动跳过
          # 多 key 加速：在 GitHub Secrets 里存 LLM_API_KEYS=key1,key2,key3（逗号分隔）
          LLM_API_KEYS: ${{ secrets.LLM_API_KEYS }}
          LLM_API_KEY:  ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL:    ${{ secrets.LLM_MODEL }}
          LLM_CONCURRENCY: "15"
          LLM_BATCH_SIZE: "20"
        run: |
          echo "▶ python -m backend.main arxiv-daily ${{ steps.window.outputs.extra }}"
          python -m backend.main arxiv-daily ${{ steps.window.outputs.extra }}

      - name: Export Supabase → papers.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          SINCE="${{ steps.window.outputs.export_since }}"
          if [ -n "$SINCE" ]; then
            python scripts/export_papers.py --since "$SINCE"
          else
            python scripts/export_papers.py
          fi

      - name: Commit & push if changed
        run: |
          if git diff --quiet frontend/data/; then
            echo "No changes to data files"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/data/papers_*.json frontend/data/meta.json
            git commit -m "chore: arxiv sync $(date -u +%Y-%m-%d) [${{ steps.window.outputs.desc }}]"
            git pull --rebase
            git push
          fi
