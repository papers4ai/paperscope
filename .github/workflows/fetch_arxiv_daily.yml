name: Fetch arXiv Daily

on:
  schedule:
    - cron: "0 2 * * *"    # UTC 02:00 = 北京 10:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch arXiv → Supabase
        continue-on-error: true   # arXiv 偶发超时/429，不阻断后续导出和部署
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m backend.main arxiv-daily --days 3
      - name: Export Supabase → papers.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/export_papers.py
      - name: Commit & push if changed
        run: |
          if git diff --quiet frontend/data/; then
            echo "No changes to data files"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/data/papers_*.json frontend/data/meta.json
            git commit -m "chore: daily arxiv sync $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
