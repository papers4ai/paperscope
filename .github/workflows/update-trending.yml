name: Weekly Trending Update

on:
  schedule:
    - cron: '0 2 * * *'   # Every day at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate trending.json
        run: python scripts/gen_trending.py

      - name: Commit updated data (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/data/trending.json
          if git diff --cached --quiet; then
            echo "No changes to trending.json — skipping commit."
          else
            git commit -m "chore: auto-update trending.json [$(date -u +%Y-%m-%d)]"
            git pull --rebase --autostash
            git push
          fi
