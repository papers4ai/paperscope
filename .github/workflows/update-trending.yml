name: Weekly Trending Update

on:
  # 等 Fetch arXiv Daily 完成后触发，确保读到最新的 papers_*.json
  workflow_run:
    workflows: ["Fetch arXiv Daily"]
    types: [completed]
  # 保留手动触发入口
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # workflow_run 下只在上游成功时才继续（手动触发时跳过此检查）
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate trending.json
        run: python scripts/gen_trending.py

      - name: Commit updated data (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/data/trending.json
          if git diff --cached --quiet; then
            echo "No changes to trending.json — skipping commit."
          else
            git commit -m "chore: auto-update trending.json [$(date -u +%Y-%m-%d)]"
            git pull --rebase --autostash
            git push
          fi
